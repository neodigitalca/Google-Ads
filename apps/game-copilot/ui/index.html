<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Copilot</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Game Copilot</h1>
      <div class="status" id="status">Connecting…</div>
    </header>

    <section class="controls">
      <label class="label" for="spoiler">Spoiler level</label>
      <select id="spoiler" class="select">
        <option value="minimal">Minimal</option>
        <option value="story" selected>Story-safe</option>
        <option value="full">Full</option>
      </select>
      <button type="button" id="modeStuck" class="btn active">Stuck</button>
      <button type="button" id="modeLoot" class="btn">Loot</button>
      <button type="button" id="ptt" class="btn primary">Push to talk</button>
    </section>

    <section class="ask-row">
      <input id="askText" class="input" type="text" placeholder="Type a question…" />
      <button type="button" id="askSend" class="btn primary">Ask</button>
    </section>

    <section class="context-strip" id="contextStrip"></section>

    <main class="answer">
      <div class="block">
        <h2>Next</h2>
        <ul id="nextSteps"></ul>
      </div>
      <div class="block">
        <h2>Watch for</h2>
        <ul id="watchFor"></ul>
      </div>
      <div class="block">
        <h2>Optional</h2>
        <ul id="optional"></ul>
      </div>
      <div class="block" id="lootBlock" hidden>
        <h2>Loot</h2>
        <p id="lootVerdict" class="loot"></p>
      </div>
      <p id="clarification" class="muted"></p>
    </main>

    <footer class="footer">
      <span id="hotkeyHint">Hold F9 in game to ask by voice</span>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
